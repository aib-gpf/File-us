<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Chapter 1</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}body{background:linear-gradient(135deg,#ff4fa3,#ff79c5,#ff9fd6);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;overflow-y:auto;

you would become the most important

is only the beginning of our story. ❤️`;let i=0,o=document.getElementById("letter");(function w(){if(i<t.length){o.textContent+=t[i++];setTimeout(w,35)}else document.getElementById("next").style.display="block"})();document.getElementById("next").onclick=()=>location.href="chapter2.html";setInterval(()=>{let h=document.createElement("div");h.className="heartFloat";h.textContent="❤";h.style.left=Math.random()*100+"vw";h.style.fontSize=(16+Math.random()*20)+"px";document.body.appendChild(h);setTimeout(()=>h.remove(),10000)},500);</script></body></html>
